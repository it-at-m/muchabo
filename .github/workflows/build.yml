# Workflow for building NPM/Maven/Python projects and Docker images
name: build

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  # JOB to run change detection
  build-check-changed-files:
    runs-on: ubuntu-latest
    # Required permissions
    permissions:
      pull-requests: read
    outputs:
      # Expose matched filters as job 'packages' output variable
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
      # For pull requests it's not necessary to checkout the code
      - uses: it-at-m/lhm_actions/action-templates/actions/action-filter@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            admin-backend:
              - admin-backend/**
              - .github/workflows/build.yml
            admin-frontend:
              - admin-frontend/**
              - admin-backend/api-spec/**
              - .github/workflows/build.yml
            muchabo-backend:
              - muchabo-backend/**
              - .github/workflows/build.yml
            muchabo-frontend:
              - muchabo-frontend/**
              - .github/workflows/build.yml
            webcomponent:
              - webcomponent/**
              - admin-backend/api-spec/**
              - .github/workflows/build.yml
      - run: |
          echo ${{ toJSON(steps.filter.outputs.changes) }}
  build:
    if: ${{ needs.build-check-changed-files.outputs.packages != '' && needs.build-check-changed-files.outputs.packages != '[]' }}
    needs: build-check-changed-files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app-path: ${{ fromJSON(needs.build-check-changed-files.outputs.packages) }}
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
      - id: node # required for steps.* syntax
        if: ${{ hashFiles(format('./{0}/package.json', matrix.app-path)) != '' }}
        uses: it-at-m/lhm_actions/action-templates/actions/action-npm-build@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
        with:
          app-path: ${{ matrix.app-path }}
      - id: maven # required for steps.* syntax
        if: ${{ hashFiles(format('./{0}/pom.xml', matrix.app-path)) != '' }}
        uses: it-at-m/lhm_actions/action-templates/actions/action-maven-build@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
        with:
          app-path: ${{ matrix.app-path }}
      - if: ${{ github.ref == 'refs/heads/main' && (steps.node.outcome == 'success' || steps.maven.outcome == 'success') && hashFiles(format('./{0}/Dockerfile', matrix.app-path)) != '' }}
        uses: it-at-m/lhm_actions/action-templates/actions/action-build-image@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
        with:
          path: ${{ matrix.app-path }}
          artifact-name: ${{ join(steps.*.outputs.artifact-name) }}
          image-name: ${{ matrix.app-path }}
          image-tags: |
            type=raw,value=dev
          platforms: "linux/amd64,linux/arm64"
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          registry-username: ${{ github.actor }}
  build-python:
    if: ${{ needs.build-check-changed-files.outputs.packages != '' && needs.build-check-changed-files.outputs.packages != '[]' && contains(needs.build-check-changed-files.outputs.packages, 'muchabo-backend') }}
    needs: build-check-changed-files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app-path: [muchabo-backend]
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@54b32c7d11363cad45838c9a3d8a8560b93f0e8c # v1.5.4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version-file: ${{ matrix.app-path }}/.python-version
      - name: Install dependencies
        working-directory: ./${{ matrix.app-path }}
        run: uv sync --group dev
      - name: Run backend tests
        working-directory: ./${{ matrix.app-path }}
        run: uv run pytest
      - if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ github.ref == 'refs/heads/main' }}
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.app-path }}
          tags: |
            type=raw,value=dev
      - if: ${{ github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./${{ matrix.app-path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
