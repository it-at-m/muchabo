name: Build and Release Frontend Docker Image

permissions:
    contents: read

on:
    push:
        tags:
            - "frontend-*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Frontend tag to release (e.g., frontend-1.0.0)"
                required: true
                default: "frontend-latest"

jobs:
    build-and-push-frontend:
        runs-on: ubuntu-latest
        permissions:
            packages: write
        steps:
            - uses: actions/checkout@v4.2.2
            - uses: docker/setup-qemu-action@v3.6.0
            - uses: docker/setup-buildx-action@v3.11.1
            - uses: docker/login-action@v3.4.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Extract version from frontend tag
              id: vars
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      FULL_TAG="${{ github.event.inputs.tag }}"
                  else
                      FULL_TAG=${GITHUB_REF#refs/tags/}
                  fi

                  if [[ "$FULL_TAG" =~ ^frontend-(.+)$ ]]; then
                      VERSION="${BASH_REMATCH[1]}"
                  else
                      echo "Error: Tag must start with 'frontend-'"
                      exit 1
                  fi

                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "repo_lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
            - uses: docker/build-push-action@v6.18.0
              with:
                  context: ./muchabo-frontend
                  file: ./muchabo-frontend/Dockerfile
                  push: true
                  sbom: true
                  provenance: true
                  tags: |
                      ghcr.io/${{ steps.vars.outputs.repo_lowercase }}/muchabo-frontend:${{ steps.vars.outputs.version }}
                      ghcr.io/${{ steps.vars.outputs.repo_lowercase }}/muchabo-frontend:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
