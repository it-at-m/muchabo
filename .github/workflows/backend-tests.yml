name: Backend Tests

on:
    pull_request:
        paths:
            - "muchabo-backend/**"
            - "contracts/bot-spec/**"
            - "ruff.toml"
            - ".github/workflows/backend-tests.yml"

permissions:
    contents: read

jobs:
    backend-tests:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: "muchabo-backend"
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v4
              with:
                  python-version-file: "muchabo-backend/.python-version"
            - name: Install dependencies
              run: uv sync --frozen --group dev
            - name: Run backend tests
              run: uv run --frozen pytest
            - name: Check Python lint
              run: uv run --frozen ruff check --config ../ruff.toml .
            - name: Check Python formatting
              run: uv run --frozen ruff format --check --config ../ruff.toml .
            - name: Check Python types
              run: uv run --frozen ty check
