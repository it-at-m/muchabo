name: Backend Tests

on:
    pull_request:
        paths:
            - "muchabo-backend/**"
            - ".github/workflows/backend-tests.yml"

permissions:
    contents: read

jobs:
    backend-tests:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: "muchabo-backend"
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v4
              with:
                  python-version-file: "muchabo-backend/.python-version"
            - name: Install dependencies
              run: uv sync --group dev
            - name: Run backend tests
              run: uv run pytest
