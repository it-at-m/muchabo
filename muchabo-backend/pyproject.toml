[project]
name = "muchabo-backend"
version = "0.1.0"
description = "FastAPI backend for muchabo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pydantic-settings==2.16.1",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "ty==0.0.92",
]

[tool.uv]
add-bounds = "exact"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
asyncio_mode = "auto"
addopts = ["--cov=muchabo", "--cov-report=term-missing"]
