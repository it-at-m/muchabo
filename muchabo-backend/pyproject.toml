[project]
name = "muchabo-backend"
version = "0.1.0"
description = "FastAPI backend for muchabo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ag-ui-protocol==1.0.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "langfuse==5.0.4",
    "openai==3.31.0",
    "opentelemetry-sdk==1.45.1",
    "pydantic==2.14.1",
    "pydantic-ai-slim[ag-ui,openai,spec]==2.63.0",
    "pydantic-settings==2.16.2",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "ty==0.0.94",
]

[tool.uv]
add-bounds = "exact"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--cov=muchabo", "--cov-report=term-missing"]
